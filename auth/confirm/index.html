<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cuvera — Confirm</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #faf8f5; color: #1a1a1a; line-height: 1.5;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff; border: 1px solid #e8e2d9; border-radius: 16px;
    padding: 32px 28px; max-width: 420px; width: 100%;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #8c2f39; margin-bottom: 14px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.3px; }
  p  { font-size: 15px; color: #555; margin-bottom: 18px; }
  .btn {
    display: block; width: 100%; text-align: center; border: 0; cursor: pointer;
    background: #1a1a1a; color: #fff; font-size: 16px; font-weight: 600;
    padding: 14px 20px; border-radius: 10px;
  }
  .btn:disabled { opacity: 0.55; cursor: default; }
  input[type=password] {
    width: 100%; font-size: 16px; padding: 13px 14px; margin-bottom: 12px;
    border: 1px solid #d9d2c7; border-radius: 10px; background: #fbfaf8; color: #1a1a1a;
  }
  .msg-error   { background: #fdeeee; color: #b85c4a; border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; }
  .msg-success { background: #eef6ee; color: #2f6b3a; border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; }
  .spinner {
    width: 26px; height: 26px; margin: 8px auto 16px;
    border: 3px solid #e8e2d9; border-top-color: #1a1a1a; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .center { text-align: center; }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand">Cuvera</div>

  <!-- Gate: explicit action required; nothing is verified on page load. -->
  <section id="state-gate" class="hidden">
    <h1 id="gate-title"></h1>
    <p id="gate-body"></p>
    <button class="btn" id="gate-button"></button>
  </section>

  <section id="state-busy" class="hidden center">
    <div class="spinner"></div>
    <p id="busy-text"></p>
  </section>

  <section id="state-password" class="hidden">
    <h1 id="pw-title"></h1>
    <p id="pw-body"></p>
    <div class="msg-error hidden" id="pw-error"></div>
    <input type="password" id="pw-new" autocomplete="new-password">
    <input type="password" id="pw-confirm" autocomplete="new-password">
    <button class="btn" id="pw-button"></button>
  </section>

  <section id="state-done" class="hidden">
    <h1 id="done-title"></h1>
    <div class="msg-success" id="done-msg"></div>
    <p id="done-body"></p>
  </section>

  <section id="state-error" class="hidden">
    <h1 id="err-title"></h1>
    <div class="msg-error" id="err-msg"></div>
    <p id="err-body"></p>
    <button class="btn hidden" id="err-retry"></button>
  </section>
</main>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://ayrfyrffvoxcdtmpmhdh.supabase.co";
  // Public anon key — safe to embed by design (Row Level Security applies).
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5cmZ5cmZmdm94Y2R0bXBtaGRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2MzczMTYsImV4cCI6MjA4NjIxMzMxNn0.x-9J8aCXOCQ-mFhsmW6BtSye_XagLcNstmdkPlCw9fI";
  var MIN_PASSWORD_LENGTH = 6; // matches the mobile app

  var fr = (navigator.language || "").toLowerCase().indexOf("fr") === 0;
  var T = fr ? {
    gateTitleSignup: "Confirmez votre e-mail",
    gateBodySignup: "Appuyez sur le bouton ci-dessous pour confirmer votre adresse e-mail et finaliser votre compte Cuvera.",
    gateButtonSignup: "Confirmer mon e-mail",
    gateTitleRecovery: "Réinitialiser votre mot de passe",
    gateBodyRecovery: "Appuyez sur le bouton ci-dessous pour continuer et choisir un nouveau mot de passe.",
    gateButtonRecovery: "Continuer",
    busyVerifying: "Vérification en cours…",
    busySaving: "Enregistrement…",
    pwTitle: "Choisissez un nouveau mot de passe",
    pwBody: "Saisissez votre nouveau mot de passe (au moins " + MIN_PASSWORD_LENGTH + " caractères).",
    pwPlaceholderNew: "Nouveau mot de passe",
    pwPlaceholderConfirm: "Confirmez le mot de passe",
    pwButton: "Enregistrer le mot de passe",
    pwMissing: "Veuillez remplir les deux champs.",
    pwMismatch: "Les mots de passe ne correspondent pas.",
    pwTooShort: "Le mot de passe doit contenir au moins " + MIN_PASSWORD_LENGTH + " caractères.",
    doneTitleSignup: "E-mail confirmé",
    doneMsgSignup: "Votre adresse e-mail est confirmée.",
    doneBodySignup: "Retournez dans l'application Cuvera et connectez-vous avec votre e-mail et votre mot de passe.",
    doneTitleRecovery: "Mot de passe mis à jour",
    doneMsgRecovery: "Votre nouveau mot de passe est enregistré.",
    doneBodyRecovery: "Retournez dans l'application Cuvera et connectez-vous avec votre nouveau mot de passe.",
    errTitleMissing: "Lien incomplet",
    errMsgMissing: "Ce lien ne contient pas les informations de confirmation attendues.",
    errBodyMissing: "Ouvrez le lien directement depuis l'e-mail que nous vous avons envoyé. S'il ne fonctionne toujours pas, demandez un nouveau lien depuis l'application.",
    errTitleExpired: "Lien expiré",
    errMsgExpired: "Ce lien a expiré ou a déjà été utilisé.",
    errBodyExpiredSignup: "Si vous avez déjà confirmé votre e-mail, connectez-vous simplement dans l'application. Sinon, demandez un nouvel e-mail de confirmation depuis l'écran « Vérifiez vos e-mails ».",
    errBodyExpiredRecovery: "Demandez un nouveau lien de réinitialisation depuis l'écran « Mot de passe oublié » de l'application.",
    errTitleInvalid: "Lien invalide",
    errMsgInvalid: "Ce lien n'a pas pu être vérifié.",
    errBodyInvalid: "Demandez un nouveau lien depuis l'application Cuvera.",
    errTitleNetwork: "Problème de connexion",
    errMsgNetwork: "Impossible de joindre le serveur.",
    errBodyNetwork: "Vérifiez votre connexion internet puis réessayez.",
    errRetry: "Réessayer"
  } : {
    gateTitleSignup: "Confirm your email",
    gateBodySignup: "Tap the button below to confirm your email address and finish setting up your Cuvera account.",
    gateButtonSignup: "Confirm my email",
    gateTitleRecovery: "Reset your password",
    gateBodyRecovery: "Tap the button below to continue and choose a new password.",
    gateButtonRecovery: "Continue",
    busyVerifying: "Verifying…",
    busySaving: "Saving…",
    pwTitle: "Choose a new password",
    pwBody: "Enter your new password (at least " + MIN_PASSWORD_LENGTH + " characters).",
    pwPlaceholderNew: "New password",
    pwPlaceholderConfirm: "Confirm password",
    pwButton: "Save password",
    pwMissing: "Please fill in both fields.",
    pwMismatch: "The passwords do not match.",
    pwTooShort: "The password must be at least " + MIN_PASSWORD_LENGTH + " characters.",
    doneTitleSignup: "Email confirmed",
    doneMsgSignup: "Your email address is confirmed.",
    doneBodySignup: "Return to the Cuvera app and sign in with your email and password.",
    doneTitleRecovery: "Password updated",
    doneMsgRecovery: "Your new password has been saved.",
    doneBodyRecovery: "Return to the Cuvera app and sign in with your new password.",
    errTitleMissing: "Incomplete link",
    errMsgMissing: "This link is missing the expected confirmation details.",
    errBodyMissing: "Open the link directly from the email we sent you. If it still doesn't work, request a new link from the app.",
    errTitleExpired: "Link expired",
    errMsgExpired: "This link has expired or was already used.",
    errBodyExpiredSignup: "If you already confirmed your email, simply sign in from the app. Otherwise, request a new confirmation email from the \u201CCheck your email\u201D screen.",
    errBodyExpiredRecovery: "Request a new reset link from the app's \u201CForgot password\u201D screen.",
    errTitleInvalid: "Invalid link",
    errMsgInvalid: "This link could not be verified.",
    errBodyInvalid: "Request a new link from the Cuvera app.",
    errTitleNetwork: "Connection problem",
    errMsgNetwork: "We couldn't reach the server.",
    errBodyNetwork: "Check your internet connection and try again.",
    errRetry: "Try again"
  };

  document.documentElement.lang = fr ? "fr" : "en";

  var params = new URLSearchParams(window.location.search);
  var tokenHash = params.get("token_hash") || "";
  var type = params.get("type") || "";
  var accessToken = null; // recovery session token, kept in memory only

  var states = ["gate", "busy", "password", "done", "error"];
  function show(state) {
    states.forEach(function (s) {
      document.getElementById("state-" + s).classList.toggle("hidden", s !== state);
    });
  }
  function el(id) { return document.getElementById(id); }

  function showError(kind) {
    var title, msg, body, retry = false;
    if (kind === "missing") { title = T.errTitleMissing; msg = T.errMsgMissing; body = T.errBodyMissing; }
    else if (kind === "expired") {
      title = T.errTitleExpired; msg = T.errMsgExpired;
      body = type === "recovery" ? T.errBodyExpiredRecovery : T.errBodyExpiredSignup;
    }
    else if (kind === "network") { title = T.errTitleNetwork; msg = T.errMsgNetwork; body = T.errBodyNetwork; retry = true; }
    else { title = T.errTitleInvalid; msg = T.errMsgInvalid; body = T.errBodyInvalid; }
    el("err-title").textContent = title;
    el("err-msg").textContent = msg;
    el("err-body").textContent = body;
    el("err-retry").classList.toggle("hidden", !retry);
    show("error");
  }

  function showDone(kind) {
    el("done-title").textContent = kind === "recovery" ? T.doneTitleRecovery : T.doneTitleSignup;
    el("done-msg").textContent = kind === "recovery" ? T.doneMsgRecovery : T.doneMsgSignup;
    el("done-body").textContent = kind === "recovery" ? T.doneBodyRecovery : T.doneBodySignup;
    show("done");
  }

  // ---- GoTrue REST helpers (no SDK, no storage: tokens live in memory only)
  function api(path, options) {
    options = options || {};
    options.headers = Object.assign(
      { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      options.headers || {}
    );
    return fetch(SUPABASE_URL + "/auth/v1" + path, options);
  }

  function classifyAuthError(status, data) {
    var code = data && (data.error_code || data.code);
    var text = ((data && (data.msg || data.message || data.error_description)) || "").toLowerCase();
    if (code === "otp_expired" || text.indexOf("expired") !== -1) return "expired";
    return "invalid";
  }

  function verifyToken() {
    show("busy");
    el("busy-text").textContent = T.busyVerifying;
    return api("/verify", {
      method: "POST",
      body: JSON.stringify({ type: type, token_hash: tokenHash })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          showError(classifyAuthError(res.status, data));
          return null;
        }
        return data;
      });
    }).catch(function () {
      showError("network");
      return null;
    });
  }

  function revokeSession(token) {
    // Best effort: this page needs no lasting session.
    return api("/logout", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token }
    }).catch(function () {});
  }

  // ---- Flows
  function runSignup() {
    verifyToken().then(function (data) {
      if (!data) return;
      if (data.access_token) revokeSession(data.access_token);
      showDone("signup");
    });
  }

  function runRecoveryVerify() {
    verifyToken().then(function (data) {
      if (!data) return;
      accessToken = data.access_token || null;
      if (!accessToken) { showError("invalid"); return; }
      el("pw-title").textContent = T.pwTitle;
      el("pw-body").textContent = T.pwBody;
      el("pw-new").placeholder = T.pwPlaceholderNew;
      el("pw-confirm").placeholder = T.pwPlaceholderConfirm;
      el("pw-button").textContent = T.pwButton;
      show("password");
      el("pw-new").focus();
    });
  }

  function runSavePassword() {
    var pwError = el("pw-error");
    var newPw = el("pw-new").value;
    var confirmPw = el("pw-confirm").value;
    pwError.classList.add("hidden");

    var validation = null;
    if (!newPw || !confirmPw) validation = T.pwMissing;
    else if (newPw !== confirmPw) validation = T.pwMismatch;
    else if (newPw.length < MIN_PASSWORD_LENGTH) validation = T.pwTooShort;
    if (validation) {
      pwError.textContent = validation;
      pwError.classList.remove("hidden");
      return;
    }

    show("busy");
    el("busy-text").textContent = T.busySaving;
    api("/user", {
      method: "PUT",
      headers: { "Authorization": "Bearer " + accessToken },
      body: JSON.stringify({ password: newPw })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          // Session died between verify and save → treat as expired link.
          if (res.status === 401 || res.status === 403) { showError("expired"); return; }
          // Validation errors (e.g. same password) → show inline, back to form.
          pwError.textContent = (data && (data.msg || data.message)) || T.errMsgInvalid;
          pwError.classList.remove("hidden");
          show("password");
          return;
        }
        var token = accessToken;
        accessToken = null;
        if (token) revokeSession(token);
        showDone("recovery");
      });
    }).catch(function () {
      showError("network");
    });
  }

  // ---- Entry
  function start() {
    if (!tokenHash || (type !== "signup" && type !== "recovery")) {
      showError("missing");
      return;
    }
    if (type === "signup") {
      el("gate-title").textContent = T.gateTitleSignup;
      el("gate-body").textContent = T.gateBodySignup;
      el("gate-button").textContent = T.gateButtonSignup;
      el("gate-button").onclick = runSignup;
    } else {
      el("gate-title").textContent = T.gateTitleRecovery;
      el("gate-body").textContent = T.gateBodyRecovery;
      el("gate-button").textContent = T.gateButtonRecovery;
      el("gate-button").onclick = runRecoveryVerify;
    }
    show("gate");
  }

  el("pw-button").onclick = runSavePassword;
  el("pw-confirm").addEventListener("keydown", function (e) { if (e.key === "Enter") runSavePassword(); });
  el("err-retry").textContent = T.errRetry;
  el("err-retry").onclick = function () {
    if (type === "signup") runSignup(); else runRecoveryVerify();
  };

  start();
})();
</script>
</body>
</html>
